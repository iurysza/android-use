name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      
      - run: bun install
      
      - run: bun run lint
      
      - run: bun run typecheck
      
      - run: bun test
      
      - run: bun run build
